<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRIZLOX (GRZL) - Airdrop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
:root{
--c1:#00ffd5;
--c2:#7c3aed;
--c3:#ff00aa;
--c4:#00ff6a;
--c5:#ffb800;
--c6:#3b82f6;
}

body{
margin:0;
font-family:Arial, sans-serif;
background:#05060a;
color:white;
overflow-x:hidden;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(-45deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6));
background-size:400% 400%;
animation:bg 12s ease infinite;
opacity:0.15;
z-index:-1;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
text-align:center;
padding:80px 20px;
}

.logo{
font-size:100px;
font-weight:bold;
background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

section{
max-width:1000px;
margin:40px auto;
padding:30px;
background:rgba(255,255,255,0.05);
border-radius:15px;
}

h2{
text-align:center;
color:var(--c3);
}

/* AIRDROP BUTTONS */
button{
padding:12px 20px;
margin:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.connect{
background:#00ffd5;
}

.claim{
background:#7c3aed;
color:white;
}

#status{
text-align:center;
margin-top:10px;
color:#00ffd5;
}

/* SOCIAL */
a{
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<div class="bg"></div>

<header>
<div class="logo">GRZL</div>
<h1 style="text-align:center;">GRIZLOX AIRDROP</h1>
<p style="text-align:center;">Claim 100 Free GRZL Tokens</p>
</header>

<!-- AIRDROP SECTION -->
<section>
<h2>AIRDROP CLAIM</h2>

<div style="text-align:center;">

<button class="connect" onclick="connectWallet()">Connect MetaMask</button>

<br>

<button class="claim" onclick="claimTokens()">Claim 100 GRZL</button>

<p id="status">Wallet not connected</p>

</div>
</section>

<!-- INFO -->
<section>
<h2>ABOUT</h2>
<p style="text-align:center;">
GRIZLOX (GRZL) is a decentralized ecosystem built for fair distribution and community growth.
</p>
</section>

<!-- CONTRACT -->
<section>
<h2>CONTRACT ADDRESS</h2>
<p style="text-align:center;color:#00ffd5;word-break:break-all;">
0xa2ACF85713E58b3f2a343E6830995713b6aea6d4
</p>
</section>

<!-- SOCIAL -->
<section>
<h2>SOCIAL LINKS</h2>
<p style="text-align:center;">
<a href="https://youtube.com/@grizloxofficial">YouTube</a> |
<a href="https://t.me/GrizloxOfficial">Telegram</a> |
<a href="https://x.com/Grizloxofficial">X</a>
</p>
</section>

<script>
let provider;
let signer;

const tokenAddress = "0xa2ACF85713E58b3f2a343E6830995713b6aea6d4";

const abi = [
  "function claim() public"
];

async function connectWallet() {
  if (!window.ethereum) {
    alert("Install MetaMask first");
    return;
  }

  provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();

  let addr = await signer.getAddress();

  document.getElementById("status").innerText =
    "Connected: " + addr;
}

async function claimTokens() {
  if (!signer) {
    alert("Connect wallet first");
    return;
  }

  const contract = new ethers.Contract(tokenAddress, abi, signer);

  try {
    document.getElementById("status").innerText = "Claiming...";

    const tx = await contract.claim();
    await tx.wait();

    document.getElementById("status").innerText =
      "✅ 100 GRZL Claimed Successfully!";
  } catch (e) {
    console.log(e);
    document.getElementById("status").innerText =
      "❌ Claim failed (check contract)";
  }
}
</script>

</body>
</html>
